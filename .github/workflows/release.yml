name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Gate on the suite
        # A tag must not publish a release the tests do not back.
        run: bash tests/framework_test.sh

      - name: Refuse to release a tag that is not on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=0
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main — tag main, not a branch."
            exit 1
          fi

      - name: Build release notes from the previous tag
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Previous tag by VERSION order, not by reachability.
          #
          # `git describe --tags --abbrev=0 "${TAG}^"` returns the nearest tag
          # reachable from the parent commit, which is not the same thing. This
          # repo's tags are already non-monotonic (v0.0.1, v0.1.0, v3.0, v3.1,
          # v4.0), and a release cut from a branch off an older line would then
          # produce notes spanning the wrong range -- silently, in a published
          # release.
          #
          # Walk ascending and take the tag immediately before this one. Sorting
          # descending and skipping the current tag looks equivalent but is not:
          # releasing a backport v4.1 while v5.0.0 exists would pick v5.0.0,
          # which is newer than the tag being released.
          PREV="$(git tag --list 'v*' --sort=v:refname \
                  | awk -v t="$TAG" '$0 == t { exit } { p = $0 } END { print p }')"

          echo "tag=${TAG} prev=${PREV:-<none>}"

          {
            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              echo
              RANGE="${PREV}..${TAG}"
            else
              echo "## Changes"
              echo
              RANGE="${TAG}"
            fi

            # Commit subjects, newest first, with short SHAs.
            git log --no-merges --format='- %s (%h)' "$RANGE"

            echo
            echo "## Contributors"
            echo
            git log --format='- %an' "$RANGE" | sort -u

            if [ -f CHANGELOG.md ]; then
              echo
              echo "See [CHANGELOG.md](CHANGELOG.md) for the categorized version of this release."
            fi

            if [ -n "$PREV" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > release-notes.md

          # An empty body would publish a release that says nothing.
          if [ ! -s release-notes.md ]; then
            echo "::error::generated release notes are empty"
            exit 1
          fi

          echo "--- generated notes ---"
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

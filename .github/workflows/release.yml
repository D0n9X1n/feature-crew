name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    name: release
    needs: test
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to release a tag that is not on main
        run: |
          set -euo pipefail
          # checkout used fetch-depth: 0, so full history is already present.
          # `git fetch --depth=0` is NOT the same as `fetch-depth: 0` -- git
          # rejects it with "fatal: depth 0 is not a positive number", which
          # would have failed this job on the first real tag push.
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main - tag main, not a branch."
            exit 1
          fi

      - name: Build release notes from the previous tag
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Called-job names may include a reusable-workflow prefix. Exclude
          # only this publishing job and fail closed on empty or non-green data.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            | jq -ers '
                [.[].jobs[] | select(.name != "release")] as $jobs
                | ($jobs[] | "- \(.name): \(.conclusion // "pending")"),
                  (if ($jobs | length) == 0 then error("no validation jobs found")
                   elif any($jobs[]; .conclusion != "success") then error("validation jobs did not all succeed")
                   else empty end)
              ' | tee validation.txt
          VALIDATION="$(cat validation.txt)"

          # Previous tag by VERSION order, not by reachability.
          #
          # `git describe --tags --abbrev=0 "${TAG}^"` returns the nearest tag
          # reachable from the parent commit, which is not the same thing. This
          # repo's tags are already non-monotonic (v0.0.1, v0.1.0, v3.0, v3.1,
          # v4.0), so on main alone the two answers differ and the notes would
          # span the wrong range -- silently, in a published release.
          #
          # Walk ascending and take the tag immediately before this one.
          # Sorting descending and skipping the current tag is not equivalent:
          # it yields the newest tag rather than the predecessor. (A backport
          # release would show that most starkly, though the ancestor gate
          # above rejects those before this step runs.)
          PREV="$(git tag --list 'v*' --sort=v:refname \
                  | awk -v t="$TAG" '$0 == t { exit } { p = $0 } END { print p }')"

          echo "tag=${TAG} prev=${PREV:-<none>}"

          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          # Refuse to publish a release with no commits. Checked before the body
          # is built, so an empty range fails loudly instead of publishing a
          # release whose Commits section is blank.
          COMMITS="$(git log --no-merges --oneline "$RANGE" | wc -l | tr -d ' ')"
          if [ "$COMMITS" -eq 0 ]; then
            echo "::error::no commits between ${PREV:-<start>} and ${TAG} - nothing to release"
            exit 1
          fi

          COMMIT_LIST="$(git log --no-merges --format='- %s' "$RANGE")"
          AGENTS="$(ls agents/*.md | wc -l | tr -d ' ')"
          SKILLS="$(find .claude/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')"

          # The release body IS the changelog. There is no CHANGELOG.md to keep
          # in sync -- one record, generated from the commits that actually
          # shipped, so it cannot drift from the tag it describes.
          {
            printf '## feature-crew %s\n\n' "$TAG"
            printf 'Automated release for %s.\n\n' "$TAG"
            printf '### Commits\n%s\n\n' "$COMMIT_LIST"
            printf '### Contents\n'
            printf -- '- %s skills (`~/.claude/skills/fc-*/`)\n' "$SKILLS"
            printf -- '- %s role agents (`~/.claude/agents/fc-*.md`), unpinned for provenance-based hard-gate selection\n' "$AGENTS"
            printf -- '- Cross-platform installer (`install.sh` / `install.ps1`)\n\n'
            printf '### Validation\n%s\n\n' "$VALIDATION"
            printf '### Install\n'
            printf '```bash\n'
            printf 'git clone https://github.com/%s.git\n' "$GITHUB_REPOSITORY"
            printf 'cd feature-crew && ./install.sh\n'
            printf '```\n\n'
            printf 'Already installed? Run `/fc-update`.\n'
            if [ -n "$PREV" ]; then
              printf '\n**Full diff:** https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$PREV" "$TAG"
            fi
          } > release-notes.md

          echo "--- generated notes (${COMMITS} commits) ---"
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

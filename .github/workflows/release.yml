name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Gate on the suite
        # A tag must not publish a release the tests do not back.
        run: bash tests/framework_test.sh

      - name: Refuse to release a tag that is not on main
        run: |
          set -euo pipefail
          git fetch origin main --depth=0
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main — tag main, not a branch."
            exit 1
          fi

      - name: Build release notes from the previous tag
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            if [ -n "$PREV" ]; then
              echo "## Changes since ${PREV}"
              echo
              RANGE="${PREV}..${TAG}"
            else
              echo "## Changes"
              echo
              RANGE="${TAG}"
            fi

            # Commit subjects, newest first, with short SHAs.
            git log --no-merges --format='- %s (%h)' "$RANGE"

            echo
            echo "## Contributors"
            echo
            git log --format='- %an' "$RANGE" | sort -u

            if [ -f CHANGELOG.md ]; then
              echo
              echo "See [CHANGELOG.md](CHANGELOG.md) for the categorized version of this release."
            fi

            if [ -n "$PREV" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > release-notes.md

          echo "--- generated notes ---"
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

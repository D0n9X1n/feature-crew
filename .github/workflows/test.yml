name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# The Windows jobs share one migration test. Stub claude/copilot CLIs record
# every call and keep plugin state in files, so no real CLI or network is used.
# Capture Write-Host (stream 6), not native stderr: redirecting native stderr can
# raise NativeCommandError in Windows PowerShell 5.1 before we inspect the exit.
env:
  SEED_OLD_INSTALL: |
    set -euo pipefail
    seed="$RUNNER_TEMP/seed"
    mkdir -p "$seed/agents/feature-crew" "$seed/skills/fc-update" "$seed/skills/fc-review" "$seed/skills/research"
    printf 'old\n' > "$seed/agents/fc-pm.md"
    printf 'old\nMY EDIT\n' > "$seed/skills/fc-update/SKILL.md"
    printf 'old\n' > "$seed/skills/fc-review/SKILL.md"
    printf 'x  agents/fc-pm.md\n' > "$seed/feature-crew.sha256"
    git cat-file blob v3.1:.claude/skills/research/SKILL.md > "$seed/skills/research/SKILL.md"
    printf 'my sources\n' > "$seed/skills/research/sources.md"
    printf 'my edited pm\n' > "$seed/agents/feature-crew/pm.md"
    printf 'my own agent\n' > "$seed/agents/pm.md"
  STUB_PS1: |
    $cli = [IO.Path]::GetFileNameWithoutExtension($MyInvocation.MyCommand.Name)
    $st = $env:FC_STUB_STATE
    New-Item -ItemType Directory -Force -Path $st | Out-Null
    $line = "$cli " + ($args -join ' ')
    Add-Content -LiteralPath (Join-Path $st 'calls') -Value $line
    $a = @($args) + @('', '')
    if ($env:FC_STUB_FAIL -and $env:FC_STUB_FAIL -eq "$cli $($a[0]) $($a[1])") {
      [Console]::Error.WriteLine("stub: $env:FC_STUB_FAIL failed"); exit 1
    }
    $mp = Join-Path $st "$cli.marketplace"; $pl = Join-Path $st "$cli.plugin"
    switch -Wildcard ($args -join ' ') {
      'plugin list --json' {
        # Like real Copilot, a registered marketplace lists its plugin disabled.
        if ($cli -eq 'claude') { if (Test-Path $pl) { '[{"id": "feature-crew@feature-crew", "scope": "user", "enabled": true}]' } else { '[]' } }
        elseif (Test-Path $pl) { '[{"name": "feature-crew", "marketplace": "feature-crew", "enabled": true}]' }
        elseif (Test-Path $mp) { '[{"name": "feature-crew", "marketplace": "feature-crew", "enabled": false}]' }
        else { '[]' }
      }
      'plugin marketplace list --json' {
        if (-not (Test-Path $mp)) { '[]' }
        elseif ($cli -eq 'claude') { '[{"name": "feature-crew", "repo": "' + (Get-Content -Raw $mp) + '"}]' }
        else { '[{"name": "feature-crew", "source": "GitHub: ' + (Get-Content -Raw $mp) + '"}]' }
      }
      'plugin marketplace add *' {
        Set-Content -NoNewline -LiteralPath $mp -Value $args[3]
        if ($args -contains '--scope') { New-Item -ItemType File -Force -Path "$mp.user" | Out-Null }
        'stub: marketplace added'
      }
      'plugin marketplace remove * --scope user --json' {
        if (-not (Test-Path "$mp.user")) { '{"outcome":"failed","failureCode":"not_configured"}'; exit 1 }
        Remove-Item -Force $mp, "$mp.user"; '{"outcome":"ok"}'
      }
      'plugin marketplace update *' { 'stub: marketplace updated' }
      'plugin marketplace remove *' { Remove-Item -Force $mp, $pl -ErrorAction SilentlyContinue; 'stub: marketplace removed' }
      'plugin install *' { New-Item -ItemType File -Force -Path $pl | Out-Null; 'stub: plugin installed' }
      'plugin update *' { 'stub: plugin updated' }
      'plugin uninstall *' { Remove-Item -Force $pl -ErrorAction SilentlyContinue; 'stub: plugin uninstalled' }
      default { [Console]::Error.WriteLine("stub: unexpected $line"); exit 9 }
    }
    exit 0
  TEST_MIGRATE: |
    Set-StrictMode -Version Latest
    $ErrorActionPreference = 'Stop'
    $v = $PSVersionTable.PSVersion.Major
    $prefix = Join-Path $env:RUNNER_TEMP "fc-old-$v-$env:FC_MODE"
    $state = Join-Path $env:RUNNER_TEMP "fc-state-$v-$env:FC_MODE"
    Remove-Item -LiteralPath $prefix, $state -Recurse -Force -ErrorAction SilentlyContinue
    Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'seed') -Destination $prefix -Recurse
    $env:FC_STUB_STATE = $state
    $env:FC_STUB_FAIL = ''
    $env:PATH = $env:FC_STUBS + [IO.Path]::PathSeparator + $env:PATH
    # Never let this test reach a real CLI: in native mode claude must be the stub.
    if ($env:FC_MODE -eq 'native') {
      $resolved = (Get-Command claude -ErrorAction Stop).Source
      if (-not $resolved.StartsWith($env:FC_STUBS)) { throw "claude resolves to $resolved, not the stub" }
    }
    if ($env:FC_MODE -eq 'delegation') {
      # A broken bash first on PATH must never run; only Git for Windows' bash may.
      $decoy = Join-Path $env:RUNNER_TEMP "decoy-$v"
      $marker = Join-Path $decoy 'ran'
      New-Item -ItemType Directory -Force -Path $decoy | Out-Null
      Set-Content -LiteralPath (Join-Path $decoy 'bash.cmd') -Encoding Ascii -Value @('@echo off', ('echo ran > "' + $marker + '"'), 'exit /b 127')
      $env:PATH = $decoy + [IO.Path]::PathSeparator + $env:PATH
    }
    function Invoke-Installer([string[]]$extra) {
      $global:LASTEXITCODE = 0
      $script:out = (& .\install.ps1 --prefix $prefix @extra 6>&1 | Out-String)
      $script:code = $LASTEXITCODE
    }
    function Test-Old($rel) { Test-Path -LiteralPath (Join-Path $prefix $rel) }

    Invoke-Installer @('--dry-run')
    if ($code -ne 0) { throw "dry run exited $code`n$out" }
    if ($out -notmatch 'would remove: .*fc-pm\.md') { throw "dry run did not list fc-pm.md`n$out" }
    if (-not (Test-Old 'agents\fc-pm.md')) { throw "dry run removed a file" }

    $env:FC_STUB_FAIL = 'copilot plugin install'
    Invoke-Installer @()
    $env:FC_STUB_FAIL = ''
    if ($code -ne 1) { throw "a failed CLI step exited $code`n$out" }
    if (-not (Test-Old 'agents\fc-pm.md')) { throw "a failed CLI step still removed the old install" }

    Invoke-Installer @()
    if ($code -ne 0) { throw "migration exited $code`n$out" }
    foreach ($gone in 'agents\fc-pm.md', 'skills\fc-update', 'skills\fc-review', 'feature-crew.sha256', 'skills\research\SKILL.md') {
      if (Test-Old $gone) { throw "$gone survived migration`n$out" }
    }
    foreach ($kept in 'agents\feature-crew\pm.md', 'agents\pm.md', 'skills\research\sources.md') {
      if (-not (Test-Old $kept)) { throw "$kept was removed`n$out" }
    }
    if ($out -notmatch 'kept \(not ours\): .*feature-crew/pm\.md') { throw "edited pre-fc agent not reported as kept`n$out" }
    $calls = Get-Content -LiteralPath (Join-Path $state 'calls') -Raw
    foreach ($want in 'claude plugin install feature-crew@feature-crew', 'copilot plugin install feature-crew@feature-crew') {
      if ($calls -notmatch [regex]::Escape($want)) { throw "missing call: $want`n$calls" }
    }

    Invoke-Installer @('-Check')
    if ($code -ne 0) { throw "check after migration exited $code`n$out" }
    Invoke-Installer @('-Uninstall')
    if ($code -ne 0) { throw "uninstall exited $code`n$out" }
    if ((Test-Path (Join-Path $state 'claude.plugin')) -or (Test-Path (Join-Path $state 'copilot.marketplace'))) { throw "uninstall left the plugin" }
    if (-not (Test-Old 'agents\pm.md')) { throw "uninstall removed a personal agent" }
    Invoke-Installer @('--source')
    if ($code -ne 2) { throw "a missing --source value exited $code" }

    if ($env:FC_MODE -eq 'delegation') {
      if (Test-Path -LiteralPath $marker) { throw "install.ps1 ran the PATH decoy" }
      if ($out -match 'using the PowerShell installer') { throw "fell back to the PowerShell installer" }
    }
    # GitHub appends exit $LASTEXITCODE; the expected exit-2 run must not fail CI.
    exit 0

  # The plugin's SessionStart hook, run as each Windows host runs it: Claude Code
  # runs `command` in Git Bash, Copilot CLI runs `powershell`. The root holds a
  # space and brackets, and each check has a mutation that must fail: an
  # unquoted root word-splits, and -Path treats the brackets as a wildcard.
  TEST_HOOK_SH: |
    set -euo pipefail
    root="$(cygpath -u "$RUNNER_TEMP")/fc hook [root]"
    mkdir -p "$root/hooks"
    cp hooks/hooks.json hooks/routing.json "$root/hooks/"
    cmd=$(python -c 'import json; print(json.load(open("hooks/hooks.json"))["hooks"]["SessionStart"][0]["hooks"][0]["command"])' | tr -d '\r')
    run_hook() { (cd "$RUNNER_TEMP" && CLAUDE_PLUGIN_ROOT="$(cygpath -w "$root")" bash -c "$1"); }
    same() { python -c 'import json,sys; sys.exit(0 if json.loads(sys.stdin.read() or "null") == json.load(open("hooks/routing.json")) else 1)'; }
    run_hook "$cmd" | same || { echo "::error::Git Bash: the hook command did not print routing.json"; exit 1; }
    if (run_hook "${cmd//\"/}" 2>/dev/null || true) | same; then echo "::error::mutation survived: unquoted root"; exit 1; fi
    echo "Git Bash: hook command prints routing.json; the unquoted-root mutation fails"
  TEST_HOOK_PS: |
    Set-StrictMode -Version Latest
    $ErrorActionPreference = 'Stop'
    $root = Join-Path $env:RUNNER_TEMP "fc hook [root] $($PSVersionTable.PSVersion.Major)"
    [IO.Directory]::CreateDirectory((Join-Path $root 'hooks')) | Out-Null
    foreach ($f in 'hooks.json', 'routing.json') { [IO.File]::Copy((Join-Path (Get-Location) "hooks/$f"), (Join-Path $root "hooks/$f"), $true) }
    $expected = Get-Content -Raw -LiteralPath 'hooks/routing.json' | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 5
    $command = (Get-Content -Raw -LiteralPath 'hooks/hooks.json' | ConvertFrom-Json).hooks.SessionStart[0].hooks[0].powershell
    function Test-Hook([string]$cmd) {
      $env:COPILOT_PLUGIN_ROOT = $root
      Push-Location -LiteralPath $env:RUNNER_TEMP
      try { $out = & ([scriptblock]::Create($cmd)) | Out-String; ($out | ConvertFrom-Json | ConvertTo-Json -Compress -Depth 5) -eq $expected }
      catch { $false }
      finally { Pop-Location }
    }
    if (-not (Test-Hook $command)) { throw "PowerShell $($PSVersionTable.PSVersion): the hook command did not print routing.json" }
    if (Test-Hook $command.Replace('-LiteralPath', '-Path')) { throw "mutation survived: -Path instead of -LiteralPath" }
    Write-Host "PowerShell $($PSVersionTable.PSVersion): hook command prints routing.json; the -Path mutation fails"

jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # T4 and T6 use `git grep`, and T43/T76/T77 run tagged installers.
          # Full history keeps git-based assertions honest.
          fetch-depth: 0

      - name: Install PyYAML
        # T5 parses agent frontmatter. Without PyYAML it skips, and under
        # FC_STRICT=1 a skip is a failure -- so this install must not be
        # allowed to silently no-op. PEP 668 makes plain `pip install --user`
        # fail on newer Ubuntu images (externally-managed-environment), so fall
        # back to --break-system-packages, then verify the import actually works.
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml \
            || python3 -m pip install --user --break-system-packages pyyaml \
            || python3 -m pip install --break-system-packages pyyaml
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Run framework tests
        # FC_STRICT turns any skipped assertion into a failure. A suite that
        # reports green while an assertion silently did not run is the exact
        # bug T10 and T15 had.
        env:
          FC_STRICT: "1"
        run: |
          pwsh --version
          bash tests/framework_test.sh

      - name: Test wiki publisher
        # The publisher's own checks, named in the CI log; T67 also runs them.
        timeout-minutes: 5
        run: bash scripts/test-wiki-publish.sh

      - name: Validate the plugin and its marketplace
        # Pinned so a CLI release cannot change validation under us. 2.1.289
        # fixed validation skipping a plugin whose folder also holds a marketplace.
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code@2.1.296
          claude --version
          claude plugin validate . --strict

  powershell:
    # The native PowerShell installer on Windows. Mask bash and git so discovery
    # through git cannot silently bypass the PowerShell implementation. Query
    # actual command locations and remove their PATH directories until neither
    # command resolves; directory-name guesses have missed bash before.
    runs-on: windows-latest
    env:
      FC_MODE: native
      MASK_BASH: |
        while ($true) {
          $commands = @(Get-Command bash, git -ErrorAction SilentlyContinue)
          if ($commands.Count -eq 0) { break }
          $before = $env:PATH
          foreach ($command in $commands) {
            $dir = Split-Path $command.Source -Parent
            $env:PATH = ($env:PATH -split ';' |
              Where-Object { $_ -and ($_.TrimEnd('\') -ne $dir.TrimEnd('\')) }) -join ';'
          }
          if ($env:PATH -eq $before) { throw "cannot mask bash/git by removing their PATH directories" }
        }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the session hook's command in Git Bash
        shell: bash
        run: eval "$TEST_HOOK_SH"

      - name: Run the session hook's PowerShell command (pwsh)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Invoke-Expression $env:TEST_HOOK_PS

      - name: Run the session hook's PowerShell command (Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        shell: powershell
        run: Invoke-Expression $env:TEST_HOOK_PS

      - name: Seed an old script install
        shell: bash
        run: eval "$SEED_OLD_INSTALL"

      - name: Write PowerShell stub CLIs
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'stubs-ps'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($c in 'claude', 'copilot') {
            Set-Content -LiteralPath (Join-Path $dir "$c.ps1") -Value $env:STUB_PS1 -Encoding Ascii
          }
          "FC_STUBS=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Migrate an old install in the PowerShell installer (pwsh)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Invoke-Expression $env:MASK_BASH
          Invoke-Expression $env:TEST_MIGRATE

      - name: Migrate an old install in the PowerShell installer (Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          Invoke-Expression $env:MASK_BASH
          Invoke-Expression $env:TEST_MIGRATE

  powershell-delegation:
    # install.ps1 hands off to Git for Windows' bash. Only bash stubs are on
    # PATH, so the PowerShell implementation cannot find a CLI: a passing run
    # proves install.sh did the work, and a decoy bash first on PATH never runs.
    runs-on: windows-latest
    env:
      FC_MODE: delegation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm Git for Windows bash is available
        shell: pwsh
        run: |
          $git = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitDir = Split-Path -Parent $git.Path
          $parent = Split-Path -Parent $gitDir
          $grandparent = Split-Path -Parent $parent
          $candidates = @(
            (Join-Path (Join-Path $parent "bin") "bash.exe")
            (Join-Path (Join-Path $grandparent "bin") "bash.exe")
          )
          $gitBash = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $gitBash) { throw "no Git for Windows bash beside git - cannot test delegation" }
          Write-Host "Git for Windows bash: $gitBash"

      - name: Seed an old script install and bash stub CLIs
        shell: bash
        run: |
          eval "$SEED_OLD_INSTALL"
          mkdir -p "$RUNNER_TEMP/stubs-sh"
          cp tests/stub-cli "$RUNNER_TEMP/stubs-sh/claude"
          cp tests/stub-cli "$RUNNER_TEMP/stubs-sh/copilot"
          echo "FC_STUBS=$(cygpath -w "$RUNNER_TEMP/stubs-sh")" >> "$GITHUB_ENV"

      - name: Migrate an old install through Git Bash (pwsh)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Invoke-Expression $env:TEST_MIGRATE

      - name: Migrate an old install through Git Bash (Windows PowerShell 5.1)
        if: ${{ !cancelled() }}
        shell: powershell
        run: Invoke-Expression $env:TEST_MIGRATE
